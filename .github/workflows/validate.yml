name: Validate Shorts Generator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Scene contract tests
        run: npm run test:scene-contract
      - name: Shorts storyboard QA tests
        run: npm run test:shorts-editor-qa
      - name: QA repair tests
        run: npm run test:qa-repair
      - name: Source evidence tests
        run: npm run test:source-fact-qa
      - name: Branded CTA end-card tests
        run: npm run test:brand-end-card
      - name: Finance short pipeline tests
        run: npm run test:short-pipeline
      - name: Narration timing, pre-TTS fit and calibration tests
        run: npm run test:narration-timing
      - name: Render optimization tests
        run: npm run test:render-optimizations
      - name: Dynamic highlight board tests
        run: npm run test:highlight-boards
      - name: Telegram approval and revision tests
        run: npm run test:telegram-review
      - name: Telegram chat command tests
        run: npm run test:telegram-chat
      - name: API auth tests
        run: npm run test:auth
      - name: Deployment info tests
        run: npm run test:deployment-info
      - name: Campaign tracking and CTA tests
        run: npm run test:campaign-tracking
      - name: Creative Director tests
        run: npm run test:creative-director
      - name: Visual QA provider fallback tests
        run: npm run test:visual-qa-providers
      - name: Pexels candidate pre-render visual QA tests
        run: npm run test:pexels-candidate-visual-qa
      - name: Supabase job history tests
        run: npm run test:supabase-history


  inspect_fly_storage:
    name: Inspect Fly.io machines and persistent volumes
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4

      - name: Ensure this is still the current main commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_main" == "$EXPECTED_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale Fly storage inspection."
          fi

      - name: Set up Fly.io CLI
        if: steps.guard.outputs.is_current == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: Inspect machines and volumes (read-only)
        if: steps.guard.outputs.is_current == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::Missing repository secret FLY_API_TOKEN"; exit 1; }
          APP="tworca-shortsow-na-podstawie-newsa-z-bankiepll"
          flyctl status --app "$APP"
          machines="$(flyctl machine list --app "$APP" --json)"
          volumes="$(flyctl volumes list --app "$APP" --json)"
          echo "MACHINE_SUMMARY:"
          node -e '
            const raw = JSON.parse(process.argv[1]);
            const rows = Array.isArray(raw) ? raw : (raw.machines || raw.data || []);
            const safe = rows.map(m => ({
              id: m.id ?? m.ID ?? null,
              name: m.name ?? m.NAME ?? null,
              state: m.state ?? m.STATE ?? null,
              region: m.region ?? m.REGION ?? null,
              hostStatus: m.host_status ?? m.hostStatus ?? null,
              image: m.config?.image ?? m.image ?? m.IMAGE ?? null,
              cpuKind: m.config?.guest?.cpu_kind ?? m.config?.guest?.cpuKind ?? null,
              cpus: m.config?.guest?.cpus ?? null,
              memoryMb: m.config?.guest?.memory_mb ?? m.config?.guest?.memoryMb ?? null,
              mounts: (m.config?.mounts ?? m.mounts ?? []).map(x => ({
                volume: x.volume ?? x.volume_id ?? null,
                destination: x.path ?? x.destination ?? null
              }))
            }));
            console.log(JSON.stringify(safe, null, 2));
          ' "$machines"
          echo "VOLUME_SUMMARY:"
          node -e '
            const raw = JSON.parse(process.argv[1]);
            const rows = Array.isArray(raw) ? raw : (raw.volumes || raw.data || []);
            const safe = rows.map(v => ({
              id: v.id ?? v.ID ?? null,
              name: v.name ?? v.NAME ?? null,
              state: v.state ?? v.STATE ?? null,
              region: v.region ?? v.REGION ?? null,
              zone: v.zone ?? v.ZONE ?? null,
              sizeGb: v.size_gb ?? v.sizeGb ?? v.size ?? v.SIZE ?? null,
              encrypted: v.encrypted ?? v.ENCRYPTED ?? null,
              attachedMachine: v.attached_machine_id ?? v.attachedMachineId ?? v.attached_vm ?? v.ATTACHED_VM ?? null
            }));
            console.log(JSON.stringify(safe, null, 2));
          ' "$volumes"
