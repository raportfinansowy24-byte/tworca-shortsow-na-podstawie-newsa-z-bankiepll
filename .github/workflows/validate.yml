name: Validate Shorts Generator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Scene contract tests
        run: npm run test:scene-contract
      - name: Shorts storyboard QA tests
        run: npm run test:shorts-editor-qa
      - name: QA repair tests
        run: npm run test:qa-repair
      - name: Source evidence tests
        run: npm run test:source-fact-qa
      - name: Branded CTA end-card tests
        run: npm run test:brand-end-card
      - name: Finance short pipeline tests
        run: npm run test:short-pipeline
      - name: Narration timing, pre-TTS fit and calibration tests
        run: npm run test:narration-timing
      - name: Render optimization tests
        run: npm run test:render-optimizations
      - name: Dynamic highlight board tests
        run: npm run test:highlight-boards
      - name: Telegram approval and revision tests
        run: npm run test:telegram-review
      - name: Telegram chat command tests
        run: npm run test:telegram-chat
      - name: API auth tests
        run: npm run test:auth
      - name: Deployment info tests
        run: npm run test:deployment-info
      - name: Campaign tracking and CTA tests
        run: npm run test:campaign-tracking
      - name: Creative Director tests
        run: npm run test:creative-director
      - name: Visual QA provider fallback tests
        run: npm run test:visual-qa-providers
      - name: Pexels candidate pre-render visual QA tests
        run: npm run test:pexels-candidate-visual-qa
      - name: Supabase job history tests
        run: npm run test:supabase-history


  deploy_production:
    name: Recover Fly volume and deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: shorts-generator-production
      cancel-in-progress: false
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4

      - name: Ensure this is still the current main commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_main" == "$EXPECTED_SHA" ]]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production deployment."
          fi

      - name: Set up Fly.io CLI
        if: steps.guard.outputs.is_current == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: Reuse or recover persistent volume safely
        if: steps.guard.outputs.is_current == 'true'
        id: volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::Missing repository secret FLY_API_TOKEN"; exit 1; }
          APP="tworca-shortsow-na-podstawie-newsa-z-bankiepll"
          SOURCE_ID="vol_4ql7e0xly8zw1qnr"
          SOURCE_NAME="shorts_data"
          TARGET_NAME="shorts_data_recovered"
          REGION="fra"
          MOUNT_PATH="/app/exports"

          machines="$(flyctl machine list --app "$APP" --json)"
          volumes="$(flyctl volumes list --app "$APP" --json)"
          machine_count="$(node -e '
            const raw = JSON.parse(process.argv[1]);
            const rows = Array.isArray(raw) ? raw : (raw.machines || raw.data || []);
            process.stdout.write(String(rows.length));
          ' "$machines")"

          source_json="$(node -e '
            const raw = JSON.parse(process.argv[1]);
            const rows = Array.isArray(raw) ? raw : (raw.volumes || raw.data || []);
            const source = rows.find(v => (v.id ?? v.ID) === process.argv[2]);
            if (!source || (source.name ?? source.NAME) !== process.argv[3] ||
                (source.region ?? source.REGION) !== process.argv[4] ||
                Number(source.size_gb ?? source.sizeGb ?? source.size ?? source.SIZE) !== 10 ||
                (source.encrypted ?? source.ENCRYPTED) !== true) {
              console.error("Original encrypted 10GB shorts_data volume not found in fra; refusing to continue.");
              process.exit(1);
            }
            const attached = source.attached_machine_id ?? source.attachedMachineId ?? source.attached_vm ?? source.ATTACHED_VM;
            if (attached) {
              console.error("Original source volume is unexpectedly attached; refusing to use it as a recovery source.");
              process.exit(1);
            }
            process.stdout.write(JSON.stringify({id: source.id ?? source.ID, zone: source.zone ?? source.ZONE}));
          ' "$volumes" "$SOURCE_ID" "$SOURCE_NAME" "$REGION")"

          existing_id="$(node -e '
            const raw = JSON.parse(process.argv[1]);
            const rows = Array.isArray(raw) ? raw : (raw.volumes || raw.data || []);
            const v = rows.find(v => (v.name ?? v.NAME) === process.argv[2] && (v.region ?? v.REGION) === process.argv[3]);
            if (v) process.stdout.write(String(v.id ?? v.ID ?? ""));
          ' "$volumes" "$TARGET_NAME" "$REGION")"

          if [[ -n "$existing_id" ]]; then
            target_json="$(node -e '
              const raw = JSON.parse(process.argv[1]);
              const rows = Array.isArray(raw) ? raw : (raw.volumes || raw.data || []);
              const source = rows.find(v => (v.id ?? v.ID) === process.argv[2]);
              const target = rows.find(v => (v.id ?? v.ID) === process.argv[3]);
              const zone = v => v.zone ?? v.ZONE;
              if (!source || !target ||
                  (target.name ?? target.NAME) !== "shorts_data_recovered" ||
                  (target.region ?? target.REGION) !== "fra" ||
                  Number(target.size_gb ?? target.sizeGb ?? target.size ?? target.SIZE) !== 10 ||
                  (target.encrypted ?? target.ENCRYPTED) !== true ||
                  zone(target) === zone(source)) {
                console.error("Existing recovery volume failed identity, region, size, encryption or zone checks.");
                process.exit(1);
              }
              const attached = target.attached_machine_id ?? target.attachedMachineId ?? target.attached_vm ?? target.ATTACHED_VM ?? "";
              process.stdout.write(JSON.stringify({id: target.id ?? target.ID, attachedMachineId: attached}));
            ' "$volumes" "$SOURCE_ID" "$existing_id")"
            attached_machine_id="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.attachedMachineId || ""));' "$target_json")"

            if [[ -n "$attached_machine_id" ]]; then
              test "$machine_count" -eq 1 || {
                echo "::error::Recovery volume is attached, but app machine count is not exactly one; refusing an unsafe deploy."
                exit 1
              }
              node -e '
                const raw = JSON.parse(process.argv[1]);
                const rows = Array.isArray(raw) ? raw : (raw.machines || raw.data || []);
                const id = process.argv[2];
                if ((rows[0].id ?? rows[0].ID) !== id) {
                  console.error("Recovery volume is attached to a machine outside the current app machine list.");
                  process.exit(1);
                }
              ' "$machines" "$attached_machine_id"

              machine_status="$(flyctl machine status "$attached_machine_id" --app "$APP" --display-config)"
              node -e '
                const raw = JSON.parse(process.argv[1]);
                const config = raw.config ?? raw;
                const volumeId = process.argv[3];
                const expectedPath = process.argv[4];
                const mounts = config.mounts ?? config.Mounts ?? [];
                const match = mounts.find(m =>
                  (m.volume ?? m.volume_id ?? m.volumeId) === volumeId &&
                  (m.path ?? m.destination) === expectedPath
                );
                if (!match) {
                  console.error("The active machine does not confirm the expected recovered volume mount; refusing to deploy.");
                  process.exit(1);
                }
                console.log(JSON.stringify({recoveredVolumeId: volumeId, mountPath: expectedPath, reusedExistingVolume: true}, null, 2));
              ' "$machine_status" "$attached_machine_id" "$existing_id" "$MOUNT_PATH"
              echo "Reusing the existing recovered volume already mounted by the active production machine."
            else
              test "$machine_count" -eq 0 || {
                echo "::error::App machines exist but the recovery volume is detached; refusing to replace machine storage automatically."
                exit 1
              }
              echo "Reusing the existing detached recovery volume; no second fork will be made."
            fi
          else
            test "$machine_count" -eq 0 || {
              echo "::error::App machines exist but the recovery volume is missing; refusing an unsafe volume fork."
              exit 1
            }
            echo "Forking the detached encrypted 10GB source volume to a new host/zone."
            flyctl volumes fork "$SOURCE_ID" \
              --app "$APP" \
              --region "$REGION" \
              --name "$TARGET_NAME" \
              --vm-size shared-cpu-8x \
              --require-unique-zone \
              --json

            volumes="$(flyctl volumes list --app "$APP" --json)"
            existing_id="$(node -e '
              const raw = JSON.parse(process.argv[1]);
              const rows = Array.isArray(raw) ? raw : (raw.volumes || raw.data || []);
              const v = rows.find(v => (v.name ?? v.NAME) === process.argv[2] && (v.region ?? v.REGION) === process.argv[3]);
              if (v) process.stdout.write(String(v.id ?? v.ID ?? ""));
            ' "$volumes" "$TARGET_NAME" "$REGION")"
            test -n "$existing_id" || { echo "::error::Recovery volume was not created or found."; exit 1; }
            node -e '
              const raw = JSON.parse(process.argv[1]);
              const rows = Array.isArray(raw) ? raw : (raw.volumes || raw.data || []);
              const source = rows.find(v => (v.id ?? v.ID) === process.argv[2]);
              const target = rows.find(v => (v.id ?? v.ID) === process.argv[3]);
              const zone = v => v.zone ?? v.ZONE;
              const attached = target?.attached_machine_id ?? target?.attachedMachineId ?? target?.attached_vm ?? target?.ATTACHED_VM;
              if (!source || !target ||
                  (target.name ?? target.NAME) !== "shorts_data_recovered" ||
                  (target.region ?? target.REGION) !== "fra" ||
                  Number(target.size_gb ?? target.sizeGb ?? target.size ?? target.SIZE) !== 10 ||
                  (target.encrypted ?? target.ENCRYPTED) !== true ||
                  zone(target) === zone(source) || attached) {
                console.error("New recovery volume failed safety checks (identity, region, size, encryption, zone or attachment).");
                process.exit(1);
              }
              console.log(JSON.stringify({
                source: {id: source.id ?? source.ID, zone: zone(source)},
                recovery: {id: target.id ?? target.ID, zone: zone(target), sizeGb: target.size_gb ?? target.sizeGb, encrypted: target.encrypted},
                originalPreserved: true
              }, null, 2));
            ' "$volumes" "$SOURCE_ID" "$existing_id"
            echo "Created and verified the detached recovery volume."
          fi

          echo "volume_id=$existing_id" >> "$GITHUB_OUTPUT"

      - name: Confirm target volume in fly.toml
        if: steps.guard.outputs.is_current == 'true'
        run: |
          set -euo pipefail
          grep -q 'source = "shorts_data_recovered"' fly.toml
          grep -q 'size = "shared-cpu-8x"' fly.toml

      - name: Deploy to Fly.io with recovered volume
        if: steps.guard.outputs.is_current == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl deploy \
            --app tworca-shortsow-na-podstawie-newsa-z-bankiepll \
            --remote-only \
            --yes \
            --strategy immediate \
            --vm-size shared-cpu-8x \
            --build-arg APP_GIT_SHA="$GITHUB_SHA"

      - name: Verify the deployed application and commit
        if: steps.guard.outputs.is_current == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://tworca-shortsow-na-podstawie-newsa-z-bankiepll.fly.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            response="$(curl -fsS --connect-timeout 5 --max-time 15 "$BASE_URL/api/healthz" 2>/dev/null || true)"
            if [[ -n "$response" ]] && node -e '
              const d = JSON.parse(process.argv[1]);
              const expected = process.argv[2];
              if (
                d.status === "ok" &&
                d.deployment?.appName === "tworca-shortsow-na-podstawie-newsa-z-bankiepll" &&
                d.deployment?.gitSha === expected &&
                typeof d.deployment?.imageRef === "string" &&
                d.deployment.imageRef.length > 0
              ) process.exit(0);
              process.exit(1);
            ' "$response" "$EXPECTED_SHA"; then
              echo "Fly.io is online on commit $EXPECTED_SHA."
              exit 0
            fi
            echo "Waiting for Fly.io health check ($attempt/60)..."
            sleep 5
          done
          echo "::error::Health check did not confirm the expected commit $EXPECTED_SHA."
          exit 1
