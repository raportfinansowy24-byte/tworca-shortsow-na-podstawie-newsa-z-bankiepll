name: Validate Shorts Generator
run-name: "R24 | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        env:
          VITE_GOOGLE_CLIENT_ID: 969674652088-refncj62i12t7k54es18vq0vidhaq4tf.apps.googleusercontent.com
        run: npm run build
      - name: Scene contract tests
        run: npm run test:scene-contract
      - name: Shorts storyboard QA tests
        run: npm run test:shorts-editor-qa
      - name: QA repair tests
        run: npm run test:qa-repair
      - name: Source evidence tests
        run: npm run test:source-fact-qa
      - name: Branded CTA end-card tests
        run: npm run test:brand-end-card
      - name: Finance short pipeline tests
        run: npm run test:short-pipeline
      - name: Narration timing, pre-TTS fit and calibration tests
        run: npm run test:narration-timing
      - name: Caption alignment mapping tests (no audio cutting)
        run: npm run test:single-narration
      - name: One continuous final TTS mix tests
        run: npm run test:final-narration-mix
      - name: Render optimization tests
        run: npm run test:render-optimizations
      - name: Dynamic highlight board tests
        run: npm run test:highlight-boards
      - name: Autopilot retry queue and bounded QA repair tests
        run: npm run test:autopilot-retry
      - name: Telegram approval and revision tests
        run: npm run test:telegram-review
      - name: Telegram chat command tests
        run: npm run test:telegram-chat
      - name: API auth tests
        run: npm run test:auth
      - name: Google OAuth session state tests
        run: npm run test:google-auth-state
      - name: Google Firebase-to-GIS migration contract tests
        run: npm run test:google-auth-migration
      - name: TTS cache retention tests
        run: npm run test:tts-cache-retention
      - name: ElevenLabs request telemetry tests
        run: npm run test:elevenlabs-request
      - name: Security, range and export path tests
        run: npm run test:security
      - name: Render completion deadline tests
        run: npm run test:render-completion
      - name: Deployment info tests
        run: npm run test:deployment-info
      - name: Campaign tracking and CTA tests
        run: npm run test:campaign-tracking
      - name: Creative Director tests
        run: npm run test:creative-director
      - name: Emotional TTS direction tests
        run: npm run test:emotional-direction
      - name: Offer catalog fetch diagnostics tests
        run: npm run test:offer-catalog-fetch
      - name: Gemini primary/fallback model routing tests
        run: npm run test:model-routing
      - name: Deployment auth readiness tests
        run: npm run test:deployment-auth-readiness
      - name: Authenticated SSE client tests
        run: npm run test:stream-ticket-clients
      - name: Bounded one-use SSE ticket store tests
        run: npm run test:stream-ticket-store
      - name: Visual QA provider fallback tests
        run: npm run test:visual-qa-providers
      - name: Stock clip rendered-window sampling tests
        run: npm run test:stock-clip-sampling
      - name: Stock QA scene-duration propagation tests
        run: npm run test:stock-qa-duration-propagation
      - name: Stock candidate soft-avoid policy tests
        run: npm run test:stock-candidate-policy
      - name: Scene-specific stock search and balanced provider selection tests
        run: npm run test:stock-scene-selection
      - name: Article visual entity extraction tests
        run: npm run test:article-visual-entities
      - name: Source-evidence visual fallback tests
        run: npm run test:source-evidence-visual
      - name: Financial scene matching tests
        run: npm run test:scene-matching
      - name: Pexels candidate pre-render visual QA tests
        run: npm run test:pexels-candidate-visual-qa
      - name: Pixabay stock video provider and semantic fallback tests
        run: npm run test:pixabay-video-provider
      - name: Supabase job history tests
        run: npm run test:supabase-history
      - name: Atomic local history tests
        run: npm run test:atomic-json
      - name: Best-effort history flush tests
        run: npm run test:best-effort-flush
      - name: Install FFmpeg and prepare Montserrat font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p fonts
          cp assets/fonts/Montserrat-Black.ttf fonts/Montserrat-Black.ttf
      - name: MP4 history validation tests
        run: npm run test:mp4-validation && npm run test:mp4-validation:integration
      - name: Karaoke ASS generation tests
        run: npm run test:karaoke-captions
      - name: Real FFmpeg karaoke render smoke test
        run: npx tsx tests/karaokeFfmpegSmoke.test.ts


# Production deployment is managed exclusively by Railway.
# This workflow validates code only; it must never call Fly.io.
