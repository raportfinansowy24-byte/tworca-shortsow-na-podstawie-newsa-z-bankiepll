name: CodeQL PR diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'server.ts'
      - 'src/server/**'
      - 'tests/mp4Validation*.test.ts'
      - '.github/workflows/codeql-pr-diagnostics.yml'

permissions:
  contents: read

jobs:
  sarif-diagnostics:
    name: Export CodeQL SARIF for PR diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Analyze without uploading to Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Preserve SARIF for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-pr-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-results/
          if-no-files-found: warn
          retention-days: 2
