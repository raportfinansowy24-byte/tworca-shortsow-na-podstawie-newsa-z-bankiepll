name: Deploy Shorts Generator to Fly.io

on:
  workflow_run:
    workflows: ["Validate Shorts Generator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shorts-generator-production
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Ensure this is still the current main commit
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_main" != "$EXPECTED_SHA" ]]; then
            echo "::notice::Skipping stale deployment; main has moved to a newer commit."
            exit 0
          fi

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::Missing repository secret FLY_API_TOKEN"; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flyctl deploy \
            --app tworca-shortsow-na-podstawie-newsa-z-bankiepll \
            --remote-only \
            --yes \
            --build-arg APP_GIT_SHA="$GITHUB_SHA"

      - name: Verify the deployed application and commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          BASE_URL: https://tworca-shortsow-na-podstawie-newsa-z-bankiepll.fly.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            response="$(curl -fsS --connect-timeout 5 --max-time 15 "$BASE_URL/api/health" 2>/dev/null || true)"
            if [[ -n "$response" ]] && node -e '
              const d = JSON.parse(process.argv[1]);
              const expected = process.argv[2];
              if (
                d.status === "online" &&
                d.deployment?.appName === "tworca-shortsow-na-podstawie-newsa-z-bankiepll" &&
                d.deployment?.gitSha === expected &&
                typeof d.deployment?.imageRef === "string" &&
                d.deployment.imageRef.length > 0
              ) process.exit(0);
              process.exit(1);
            ' "$response" "$EXPECTED_SHA"; then
              echo "Fly.io is online on commit $EXPECTED_SHA."
              exit 0
            fi
            echo "Waiting for Fly.io health check ($attempt/36)..."
            sleep 5
          done
          echo "::error::Health check did not confirm the expected commit $EXPECTED_SHA."
          exit 1
