# Existing Fly app is reused to avoid creating a duplicate application.
# A single shared-cpu-8x (2 GB) Machine and 10 GB volume are expected to cost
# about $17.06/month at 730 hours, plus egress and taxes (pricing checked 2026-10-16).

app = "tworca-shortsow-na-podstawie-newsa-z-bankiepll"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APP_URL = "https://tworca-shortsow-na-podstawie-newsa-z-bankiepll.fly.dev"
  FIREBASE_PROJECT_ID = "gen-lang-client-0568813813"
  AUTOPILOT_ALLOWED_EMAILS = "raportfinansowy24@gmail.com"

[[mounts]]
  source = "shorts_data"
  destination = "/app/exports"
  initial_size = "10gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-8x"
